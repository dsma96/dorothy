spring.application.name=dorothy
spring.quartz.job-store-type=memory
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa


spring.jpa.generate-ddl=true
spring.jpa.database-platform= org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.token.secret=jwt.token.secret=test_secret_key_which_must_be_at_least_32_characters_long


sms.twilio.sid=TWILIO_SID
sms.twilio.auth=TWILIO_AUTH
sms.twilio.from=TWILIO_FROM
# Add other necessary properties if they are used by @Value in your code

logging.level.root=debug


